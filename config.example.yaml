# 猪猪求职助手 配置文件
# 复制此文件为 config.yaml 并修改为你的实际配置

profile:
  resume_path: "./resume.md"
  # 用于校招/社招岗位筛选与 AI 评分；留空保持旧行为。
  education: ""
  recruitment_type: ""  # campus / experienced / both
  resume_output_dir: "./data/resumes"
  target_roles: ["你的目标岗位1", "目标岗位2", "目标岗位3"]
  target_cities: ["北京"]
  salary_min: 15  # K
  salary_max: 25  # K
  salary_ceil_ratio: 1.5  # 岗位薪资下限超过 salary_max × 该倍数时过滤
  filter_unparsed_salary: true  # 过滤面议或无法解析薪资的岗位
  allow_internship: false  # 开启时自动关闭 filter_unparsed_salary，避免日薪实习被误过滤
  deal_breakers: ["外包", "996"]
  jd_deal_breakers: []  # 示例：需要排除完整 JD 中的词时再填写
  blocked_companies: [] # 示例：不希望采集的公司名称或关键词
  # 可选：个人亮点（用于招呼语生成）
  extra_highlights:
    - "你的核心竞争力描述"
  # 可选：在线作品集链接
  portfolio_url: ""

search:
  keywords: ["关键词1", "关键词2"]
  cities: ["北京"]
  city_codes: {}  # 自定义城市名称 -> 平台城市编码，由配置页自动填写
  max_pages: 5
  sort: newest

collection:
  default_order: [boss]
  auto_score_default: false
  # BOSS 直聘采集的页面额度与风险暂停
  daily_search_page_limit: 60     # BOSS 单日搜索页上限
  daily_detail_page_limit: 900    # BOSS 单日详情页尝试上限
  max_consecutive_page_failures: 3
  risk_pause_min_minutes: 5       # BOSS 风险信号后随机暂停下限
  risk_pause_max_minutes: 10      # BOSS 风险信号后随机暂停上限
  collection_delay_multiplier: 1.5 # BOSS 采集等待时间倍数

platforms:
  boss:
    enabled: true
    search:
      keywords: ["关键词1", "关键词2"]
      cities: ["北京"]
      city_codes: {}
      max_pages: 5
      sort: newest

scoring:
  threshold: 70
  max_candidates: 20

ai:
  provider: "openai_compatible"
  service: "deepseek"            # deepseek / anthropic / doubao / custom
  model: "deepseek-v4-pro"
  thinking: "auto"               # auto / disabled / enabled / off
  thinking_budget: 2048           # thinking=enabled 时使用，至少 1024
  timeout_seconds: 180
  scoring_max_tokens: 8192
  scoring_max_attempts: 2
  scoring_concurrency: 1          # AI评分并发数，范围1-3；数据库仍串行写入
  scoring_second_review: false    # 可选：对68-79分临界岗位进行一次独立复核
  # 可选：为不同任务覆盖通用 thinking 与超时设置
  # scoring_thinking_mode: "enabled"
  # scoring_timeout_seconds: 180
  resume_max_pages: 3
  # 建议在本地面板填写 api_key；它会单独保存在忽略提交的本地凭据文件中，不写入 config.yaml
  # base_url 填写后优先生效；留空时才读取对应环境变量或使用服务商默认地址
  # （ANTHROPIC_API_KEY / DEEPSEEK_API_KEY / ARK_API_KEY / OPENAI_API_KEY）
  # api_key: "your-api-key"
  # base_url: "https://api.anthropic.com"

dedup:
  history_file: "./data/history.jsonl"

safety:
  daily_platform_page_limit: 1100  # 仅 BOSS：采集页面打开的每日硬上限
  risk_lock_minutes: 10           # 检测到风险信号后的短时冷却

browser:
  runtime: "builtin"
  proxy_host: "127.0.0.1"
  proxy_port: 3456
  chrome_ports: [9222, 9229, 9333]
  auto_start_proxy: true
  enable_port_guard: true
  site_patterns: true
